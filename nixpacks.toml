# Deploys the API and the portal as one application.
#
# Base directory is the repository root, not backend/ or frontend/. One
# resource, one domain, one port: the portal is published and the API runs on
# loopback behind it. See scripts/start.mjs.

[phases.setup]
nixPkgs = ['nodejs_22', 'openssl']

[phases.install]
cmds = [
  'cd backend && npm ci',
  'cd frontend && npm ci',
]

[phases.build]
cmds = [
  'cd backend && npm run build',
  'cd frontend && npm run build',
]

[start]
cmd = 'npm start'
